# The relay's image (feyn-os, relay distribution design, section 6.1): a tag
# v<version> runs the tests and pushes ghcr.io/feyn-machines/feyn-relay:<version>
# and :latest, with this workflow's own token. The tag must equal
# package.json's version, and a version already pushed is refused.
name: image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/feyn-machines/feyn-relay

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check the tag against package.json
        id: version
        run: echo "version=$(scripts/check-version "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # After signing in, so a package that is still private is seen too.
      - name: Refuse a version already pushed
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "$IMAGE:${{ steps.version.outputs.version }} exists already; bump package.json" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/feyn-machines/feyn-relay
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
