services:
  relay:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      RELAY_PORT: "7300"
      LISTEN_HOST: "0.0.0.0"
      RELAY_STATE: /state/relay.json
      BLOB_DIR: /blobs
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:7300:7300"
    volumes:
      # The relay's state file and the blob endpoint's key pair.
      - ./state:/state
      # Ciphertext files, each for one fetch or 24 hours; at most 2 GiB.
      - ./blobs:/blobs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
