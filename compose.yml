services:
  relay:
    # The public image, pulled with no token; `docker compose build` makes
    # it from this directory instead, for local use.
    image: ghcr.io/feyn-machines/feyn-relay:latest
    build: .
    restart: unless-stopped
    # .env (mode 0600) holds RELAY_OWNER_TOKEN, RELAY_HOST (this relay's
    # domain) and, until admin.json exists in ./state, ADMIN_USER and
    # ADMIN_PASSWORD (at least 12 characters) for the admin page's account.
    env_file: .env
    environment:
      RELAY_PORT: "7300"
      LISTEN_HOST: "0.0.0.0"
      RELAY_STATE: /state/relay.json
      BLOB_DIR: /blobs
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:7300:7300"
    volumes:
      # The relay's state file, machines.json, admin.json, the statement
      # (relay-statement.json and its .sig) and the blob endpoint's key pair.
      - ./state:/state
      # Ciphertext files, each for one fetch or 24 hours; at most 2 GiB.
      - ./blobs:/blobs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
